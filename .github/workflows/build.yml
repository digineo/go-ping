name: build

on:
- push
- pull_request

jobs:
  build:
    name: Tests (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go:
        - "1.23"   # minimum version from go.mod
        - stable   # latest release
    steps:

    - name: Set up Go ${{ matrix.go }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v5

    - name: Build commands
      run: .github/build-all

    - name: Allow unprivileged ICMP sockets
      run: sudo sysctl -w 'net.ipv4.ping_group_range=0 2147483647'

    - name: Run tests without privileges
      run: RUN_UNPRIVILEGED=1 go test -v -coverprofile coverage.txt ./...

    - name: Run privileged ICMP tests
      run: sudo env RUN_PRIVILEGED=1 "$(command -v go)" test -v -run '^TestPinger_Privileged$' .

    - name: Upload coverage report
      uses: codecov/codecov-action@v5
      with:
        files: coverage.txt
